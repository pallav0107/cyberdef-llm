name: "3 · train"
run-name: "train ${{ inputs.base }} -> imp_${{ inputs.out_tag }}"

# Step 3 of 5 (1 checks -> 2 trace bank -> 3 train -> 4 test -> 5 status). Manual: Run workflow.
# Standardized training entry point. Replaces the hand-run scripts/imp_box_lane*.sh launches.
# Runs the SAME scripts/imp_train.py the lanes call, on a self-hosted runner chosen by model size
# (<=14B -> gpu-box 4-bit QLoRA; larger -> spark). Nothing auto-triggers training; it is manual.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base model id (e.g. Qwen/Qwen2.5-7B-Instruct)"
        required: true
        default: "Qwen/Qwen2.5-7B-Instruct"
      out_tag:
        description: "Adapter tag -> out/imp_<tag>"
        required: true
      dataset:
        description: "Dataset (benchdata key) or comma list"
        required: true
        default: "primevul"
      arm:
        description: "Experiment arm flags, verbatim (e.g. '--length-match', '--pair-loss 1.0 --items-file ...', '--adv-length 1.0')"
        required: false
        default: ""
      epochs:
        required: false
        default: "2"
      lr:
        required: false
        default: "1e-4"
      seed:
        required: false
        default: "0"
      n_per_class:
        required: false
        default: "1000"
      force_lane:
        description: "Override runner routing: '' (auto) | gpu-box | spark"
        required: false
        default: ""
      ack_oom:
        description: "Set 'true' to attempt training a model the router flags as too big to train on the chosen lane"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  route:
    name: "1. Pick the machine (<=14B box GPU, larger Spark)"
    runs-on: [self-hosted, cyberdef]
    outputs:
      lane: ${{ steps.r.outputs.lane }}
      lane_name: ${{ steps.r.outputs.lane_name }}
      reason: ${{ steps.r.outputs.reason }}
      train_warn: ${{ steps.r.outputs.train_warn }}
    steps:
      - name: 1. Check out the code
        uses: actions/checkout@v4
      - id: r
        name: 2. Route by model size
        run: python3 scripts/ci_route.py --mode train --model "${{ inputs.base }}" --force "${{ inputs.force_lane }}" >> "$GITHUB_OUTPUT"

  train:
    name: "2. Train on ${{ needs.route.outputs.lane_name }}"
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.lane) }}
    # one training job per lane at a time; never cancel a run in progress
    concurrency:
      group: cyberdef-train-${{ needs.route.outputs.lane_name }}
      cancel-in-progress: false
    steps:
      - name: 1. Check out the code
        uses: actions/checkout@v4

      - name: 2. Preflight (routing + will it fit)
        run: |
          echo "lane=${{ needs.route.outputs.lane_name }} :: ${{ needs.route.outputs.reason }}"
          WARN='${{ needs.route.outputs.train_warn }}'
          if [ -n "$WARN" ] && [ "${{ inputs.ack_oom }}" != "true" ]; then
            echo "::error::$WARN  (re-run with ack_oom=true to attempt anyway)"
            exit 1
          fi
          [ -n "$WARN" ] && echo "::warning::$WARN"
          command -v "${CYBERDEF_PY:-python3}" >/dev/null || { echo "::error::python interpreter not found — set CYBERDEF_PY in the runner .env (see docs/CI_RUNNERS.md)"; exit 1; }

      - name: 3. Record environment drift vs pinned constraints
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-python3}" -m pip freeze > /tmp/env_now.txt 2>/dev/null || true
          if [ -f constraints.txt ]; then
            diff -u constraints.txt /tmp/env_now.txt > /tmp/env_drift.txt || true
            [ -s /tmp/env_drift.txt ] && echo "::warning::env differs from constraints.txt (recorded in provenance)"
          fi

      - name: 4. Train (waits for the GPU lock; same engine as the lanes)
        env:
          PYTHONPATH: src
          HF_HUB_DISABLE_XET: "1"
          PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"   # shared GPU lock file + data live in the maintained repo
          LANE="${{ needs.route.outputs.lane_name }}"
          LOCK=".box_gpu.lock"; [ "$LANE" = "spark" ] && LOCK=".spark_ci.lock"
          OUT="out/imp_${{ inputs.out_tag }}"
          ARGS=(--base "${{ inputs.base }}" --out "$OUT" --dataset "${{ inputs.dataset }}" --n-per-class "${{ inputs.n_per_class }}"
                --epochs "${{ inputs.epochs }}" --lr "${{ inputs.lr }}" --seed "${{ inputs.seed }}"
                --meta "ci run=${{ github.run_id }} sha=${{ github.sha }} lane=$LANE")
          echo "trainer sha256: $(sha256sum scripts/imp_train.py | cut -c1-16)"
          if [ "$LANE" = "spark" ]; then
            # Spark: system python has no torch; train inside cyberdef-train:aarch64 via gdock (same as the Spark queue jobs),
            # admitted like the queue runner: wait until MemAvailable >= job + 40 GB reserve.
            source scripts/gpu_job_lib.sh; source scripts/imp_job_lib.sh 2>/dev/null || true; export IMP_PYLIB=/work/imp_pylib
            export MEM_GB=40; need=$((MEM_GB + 40))
            until [ "$(awk '/MemAvailable/{print int($2/1048576)}' /proc/meminfo)" -ge "$need" ]; do echo "waiting: need ${need} GB MemAvailable"; sleep 60; done
            exec 9>"$LOCK"; echo "waiting for Spark CI lock..."; flock 9
            gdock '' scripts/imp_train.py "${ARGS[@]}" ${{ inputs.arm }}
          else
            # box: flock serializes against the legacy lane scripts; one GPU job at a time
            exec 9>"$LOCK"; echo "waiting for box GPU lock..."; flock 9
            "${CYBERDEF_PY:-python3}" scripts/imp_train.py "${ARGS[@]}" ${{ inputs.arm }}
          fi
          flock -u 9

      - name: 5. Stamp provenance
        if: always()
        env:
          PYTHONPATH: src
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-python3}" scripts/ci_provenance.py \
            --kind train --out-tag "${{ inputs.out_tag }}" --lane "${{ needs.route.outputs.lane_name }}" \
            --inputs "base=${{ inputs.base }};dataset=${{ inputs.dataset }};arm=${{ inputs.arm }};epochs=${{ inputs.epochs }};lr=${{ inputs.lr }};seed=${{ inputs.seed }}" \
            --env-drift /tmp/env_drift.txt \
            --out "out/imp_${{ inputs.out_tag }}_provenance.json" || echo "::warning::provenance step failed"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -r "out/imp_${{ inputs.out_tag }}" out/imp_${{ inputs.out_tag }}_*.json "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

      - name: 6. Upload adapter, logs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-${{ inputs.out_tag }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
