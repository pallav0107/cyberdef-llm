name: trace-bank

# ① TRACE BANK regeneration on Spark under schema v2.3 (empty-witness grammar bug fixed), then the per-category
# CoT funnel (CWE class -> OWASP -> monitor -> validator -> concrete witness -> kept). Manual dispatch only.
# Runs inside cyberdef-train:aarch64 via gdock, admitted like the Spark queue runner (MemAvailable >= job + reserve).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Generator (HF id cached on Spark)"
        required: true
        default: "Qwen/Qwen2.5-14B-Instruct"
      gen:
        description: "Generator tag recorded in each trace"
        required: true
        default: "g14"
      pools:
        description: "Pools (A,B,C,J,J2) - ignored when subset=quick"
        required: true
        default: "J,J2"
      subset:
        description: "'' (use pools) or 'quick' (the pre-registered quick-bank subset)"
        required: false
        default: ""
      limit:
        description: "First N items per pool (0 = all; pilot only)"
        required: false
        default: "40"
      k:
        description: "Samples per function"
        required: false
        default: "2"
      gpu_util:
        required: false
        default: "0.40"
      mem_gb:
        description: "Memory the job needs (admission waits for this + 20 GB reserve)"
        required: false
        default: "56"
      tag:
        description: "Output tag -> results/imp_bank_<tag>.jsonl"
        required: true
        default: "v23_pilot_g14"

permissions:
  contents: read

concurrency:
  group: cyberdef-trace-bank
  cancel-in-progress: false

jobs:
  schema_control:
    runs-on: [self-hosted, cyberdef, spark]
    steps:
      - name: Grammar admits concrete witnesses (live) and the stripped-fix mutant is caught
        run: |
          cd "${CYBERDEF_REPO:=$HOME/cyberdef-lm}"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HF_HOME=/hf -e HF_HUB_OFFLINE=1 -e PYTHONPATH=/work/src \
            -v "$CYBERDEF_REPO:/work:ro" -v "$HOME/.cache/huggingface:/hf:ro" -w /work --entrypoint python3 cyberdef-train:aarch64 \
            scripts/ci_schema_control.py

  generate:
    needs: schema_control
    runs-on: [self-hosted, cyberdef, spark]
    steps:
      - name: Generate traces (schema v2.3, guided JSON, few-shot)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/cyberdef-lm}"
          source scripts/gpu_job_lib.sh; source scripts/imp_job_lib.sh 2>/dev/null || true; export IMP_PYLIB=/work/imp_pylib
          export MEM_GB=${{ inputs.mem_gb }}; need=$((MEM_GB + 20))
          until [ "$(awk '/MemAvailable/{print int($2/1048576)}' /proc/meminfo)" -ge "$need" ]; do echo "waiting: need ${need} GB MemAvailable"; sleep 60; done
          exec 9>"$CYBERDEF_REPO/.spark_ci.lock"; echo "waiting for Spark CI lock..."; flock 9
          OUT="results/imp_bank_${{ inputs.tag }}.jsonl"
          SUB=""; [ -n "${{ inputs.subset }}" ] && SUB="--subset ${{ inputs.subset }}"
          LIM=""; [ "${{ inputs.limit }}" != "0" ] && LIM="--limit ${{ inputs.limit }}"
          gdock '' scripts/imp_trace_bank.py --gen "${{ inputs.gen }}" --model "${{ inputs.model }}" --pools "${{ inputs.pools }}" $SUB $LIM \
            --fewshot results/imp_fewshot_exemplars.json --k "${{ inputs.k }}" --gpu-util "${{ inputs.gpu_util }}" --out "$OUT"
          test -s "$OUT" || { echo "::error::no traces written to $OUT"; exit 1; }
          echo "traces: $(wc -l < "$OUT")"

  funnel:
    needs: generate
    runs-on: [self-hosted, cyberdef, spark]
    steps:
      - name: Per-category CoT funnel (CWE -> OWASP -> monitor -> validator -> concrete witness -> kept)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/cyberdef-lm}"
          python3 scripts/ci_bank_funnel.py "results/imp_bank_${{ inputs.tag }}.jsonl" \
            --json "results/imp_bank_${{ inputs.tag }}_funnel.json" --md "/tmp/funnel_$GITHUB_RUN_ID.md"
          cat "/tmp/funnel_$GITHUB_RUN_ID.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"; cp "results/imp_bank_${{ inputs.tag }}_funnel.json" "$GITHUB_WORKSPACE/artifacts/"
      - name: Upload funnel
        uses: actions/upload-artifact@v4
        with:
          name: trace-bank-${{ inputs.tag }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
