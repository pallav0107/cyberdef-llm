name: checks

# All fail-first checks in one place (merged from the former `ci` and `controls` workflows). Each control is a pair:
# the real thing must PASS and a deliberately broken mutant must be CAUGHT. No GPU. Public repo + self-hosted runners:
# deliberately NO pull_request trigger, so code from a fork can never run on the box or Spark.

on:
  push:
    branches: [main]
    paths: ["src/**", "acceptance/**", "scripts/imp_*.py", "scripts/imp_shim.c", "scripts/ci_controls.py", "scripts/ci_gate.py",
            "scripts/ci_route.py", "scripts/ci_data_manifest.py", "scripts/ci_schema_control.py", "data/DATA_MANIFEST.json",
            "constraints.txt", ".github/workflows/checks.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # every 6 h (UTC): catches drift in the box / Spark environment

permissions:
  contents: read

concurrency:
  group: cyberdef-checks
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, cyberdef, cpu-box]
    env:
      PYTHONPATH: src
    steps:
      - name: Engine imports + dependency sanity
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" -m pip check || echo "::warning::pip check reported issues"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" -c "import cyberdef, cyberdef.imp_common, cyberdef.exec_oracle; print('cyberdef imports OK')"
      - name: Environment matches the pin (drift is a warning, recorded in provenance)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" -m pip freeze > /tmp/env_now_$GITHUB_RUN_ID.txt
          diff -q constraints.txt /tmp/env_now_$GITHUB_RUN_ID.txt >/dev/null 2>&1 || { echo "::warning::environment differs from constraints.txt"; diff -u constraints.txt /tmp/env_now_$GITHUB_RUN_ID.txt | head -40 || true; }
      - name: Router routes by model size
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          set -e
          chk() { got=$(python3 scripts/ci_route.py --mode "$3" --model "$1" 2>/dev/null | grep '^lane_name=' | cut -d= -f2); \
                  [ "$got" = "$2" ] || { echo "::error::route $1 expected $2 got $got"; exit 1; }; echo "route $1 -> $got OK"; }
          chk "Qwen/Qwen2.5-7B-Instruct" gpu-box train
          chk "Qwen/Qwen2.5-14B-Instruct" gpu-box train
          chk "fdtn-ai/Foundation-Sec-8B" gpu-box train
          chk "deepseek-r1:32b" spark eval
          chk "qwen3.8:27b" spark eval
      - name: Result-integrity gate self-test (a tampered headline must be caught)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" scripts/ci_gate.py --selftest
      - name: Witness parser self-test
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          from imp_witness_common import parse_witness
          assert parse_witness('noise {"argv": ["x; CANARY"], "stdin": ""} tail')["argv"] == ["x; CANARY"]
          assert parse_witness("no json here") is None
          assert parse_witness('{"verdict": "SAFE"}') is None
          assert parse_witness('{"env": {"BAD-KEY": "v", "QUERY": "x"}}')["env"] == {"QUERY": "x"}
          print("witness parser OK")
          PY

  data_integrity:
    runs-on: [self-hosted, cyberdef, cpu-box]
    steps:
      - name: Manifest self-test (a corrupted copy must be caught)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" scripts/ci_data_manifest.py --selftest
      - name: Canonical datasets match data/DATA_MANIFEST.json (sha256)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" scripts/ci_data_manifest.py --check

  length_matched_sets:
    runs-on: [self-hosted, cyberdef, cpu-box]
    steps:
      - name: Length-only AUROC in [0.45, 0.55] on every matched eval set (+ mutant must leave the band)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          set +e
          PYTHONPATH=src "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" scripts/ci_controls.py --only length \
            --out results/ci_controls_length.json --md /tmp/ctl_length_$GITHUB_RUN_ID.md; rc=$?
          cat /tmp/ctl_length_$GITHUB_RUN_ID.md >> "$GITHUB_STEP_SUMMARY"; exit $rc

  execution_oracle:
    runs-on: [self-hosted, cyberdef, cpu-box]
    steps:
      - name: exec_oracle self-tests (real must pass; never/always mutants must be caught)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          set +e
          PYTHONPATH=src "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" scripts/ci_controls.py --only oracle --timeout 900 \
            --out results/ci_controls_oracle.json --md /tmp/ctl_oracle_$GITHUB_RUN_ID.md; rc=$?
          cat /tmp/ctl_oracle_$GITHUB_RUN_ID.md >> "$GITHUB_STEP_SUMMARY"; exit $rc

  acceptance_selftests:
    runs-on: [self-hosted, cyberdef, cpu-box]
    steps:
      - name: acceptance/improve self-tests and their --broken mutants (per MUTATION_PROOF.md)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          set +e
          PYTHONPATH=src "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" scripts/ci_controls.py --only accept --timeout 900 \
            --out results/ci_controls_accept.json --md /tmp/ctl_accept_$GITHUB_RUN_ID.md; rc=$?
          cat /tmp/ctl_accept_$GITHUB_RUN_ID.md >> "$GITHUB_STEP_SUMMARY"; exit $rc

  schema_grammar:
    runs-on: [self-hosted, cyberdef, spark]
    steps:
      - name: SC-CoT guided-decoding grammar admits concrete witnesses (and the stripped-fix mutant is caught)
        run: |
          cd "${CYBERDEF_REPO:=$HOME/cyberdef-lm}"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HF_HOME=/hf -e HF_HUB_OFFLINE=1 -e PYTHONPATH=/work/src \
            -v "$CYBERDEF_REPO:/work:ro" -v "$HOME/.cache/huggingface:/hf:ro" -w /work --entrypoint python3 cyberdef-train:aarch64 \
            scripts/ci_schema_control.py
