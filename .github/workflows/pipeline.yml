name: pipeline

# AUTO-GENERATED by `scripts/ci_pipeline.py --emit-yaml` from its STAGES registry; do not hand-edit.
# One job per box of the TRAIN + TEST diagram (PIPELINE_REVIEW_2026-11-14.md). Colours are computed from the real
# artifacts by the `plan` job: green = VERIFIED, red = FAILED, skipped/grey = PENDING / BLOCKED / RUNNING (reason in
# the run summary). Refreshes after every train/eval/witness/controls run and every 3 h.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 */3 * * *"
  workflow_run:
    workflows: ["witness-train-test", "train", "eval", "controls"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cyberdef-pipeline-board
  cancel-in-progress: true

jobs:
  plan:
    name: "STATUS · read every stage (box + Spark), recompute AUROCs"
    runs-on: [self-hosted, cyberdef, cpu-box]
    outputs:
      board: ${{ steps.b.outputs.board }}
    steps:
      - id: b
        name: Compute the board
        run: |
          cd "${CYBERDEF_REPO:=$HOME/missions/cyberdef-llm}"
          "${CYBERDEF_PY:-$CYBERDEF_REPO/.venv/bin/python}" scripts/ci_pipeline.py --status --json /tmp/board_$GITHUB_RUN_ID.json --md /tmp/board_$GITHUB_RUN_ID.md
          echo "board=$(cat /tmp/board_$GITHUB_RUN_ID.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/board_$GITHUB_RUN_ID.md >> "$GITHUB_STEP_SUMMARY"

  d_train_A:
    name: "A · PrimeVul train (length-matched pools) · ${{ fromJSON(needs.plan.outputs.board).d_train_A.status }}"
    needs: [plan]
    if: ${{ always() && needs.plan.result == 'success' && !contains(fromJSON('["PENDING","BLOCKED","RUNNING"]'), fromJSON(needs.plan.outputs.board).d_train_A.status) }}
    runs-on: ubuntu-latest
    steps:
      - name: "0 DATA · A · PrimeVul train (length-matched pools)"
        env:
          STATUS: ${{ fromJSON(needs.plan.outputs.board).d_train_A.status }}
          DETAIL: ${{ fromJSON(needs.plan.outputs.board).d_train_A.detail }}
        run: |
          echo "status: $STATUS"
          printf '%s\n' "$DETAIL" | tr '|' '\n'
          [ "$STATUS" = "VERIFIED" ]

  d_train_B:
    name: "B · VulSpot train pairs (1,000 vuln/fix) · ${{ fromJSON(needs.plan.outputs.board).d_train_B.status }}"
