name: "GPU · train + test"
run-name: "GPU · ${{ inputs.train && 'train + test' || 'test only' }} · ${{ inputs.model }}${{ inputs.train && format(' · {0}', inputs.data) || '' }}${{ inputs.tag != '' && format(' · {0}', inputs.tag) || '' }}"

# Box GPU (24 GB CUDA; <=14B, 4-bit QLoRA). The same nine steps as "Spark · train + test", in the same order, on the same data:
#   1 plan · 2 checks · 3 dataset · 4 train · 5 test · 6 grade · 7 provenance · 8 upload · 9 status
# CoT data is built once on Spark (trace generation needs vLLM) from the v2.3 trace bank and copied here byte-identical.
# The work is in scripts/ci_step.sh, shared with the Spark workflow. Untick "train" to test an existing adapter
# (out/imp_<tag>) or, with a blank tag, the base model. Public repo + self-hosted runner: manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model (Hugging Face id, <=14B for the box GPU; or an Ollama tag for zero-shot)"
        default: "Qwen/Qwen2.5-7B-Instruct"
      tag:
        description: "Adapter name: train writes out/imp_<tag> (must not exist yet); test reads it. Blank = base model (test only)"
        default: ""
      train:
        description: "Train first (untick to only test)"
        type: boolean
        default: true
      data:
        description: "Training data (for test only: what the adapter was trained on). CoT arms: pre-registered recipe on the batch-2 bank (amendment 2); train each arm AND its twin; arm 7 only if its gate passes"
        type: choice
        options:
          - "answer-only, length-matched PrimeVul"
          - "answer-only, raw PrimeVul (length-confounded contrast)"
          - "CoT arm 2: traces passing V+P+S"
          - "CoT arm 2 twin: same rows, verdict only"
          - "CoT arm 6: counterfactual traces"
          - "CoT arm 6 twin: same rows, verdict only"
          - "CoT arm 7: execution-grounded traces"
          - "CoT arm 7 twin: same rows, verdict only"
          - "Qwen3.8 self-training: CoT items (amendment 3; results/<tag>_items.json)"
          - "Qwen3.8 self-training: twin (amendment 3; tag ends _twin)"
        default: "answer-only, length-matched PrimeVul"
      train_flags:
        description: "Extra trainer flags, space-separated (e.g. --items-file results/x.json --epochs 3). Defaults: --n-per-class 1000 --epochs 2 --lr 1e-4 --seed 0"
        default: ""
      test_set:
        description: "Test sets. Pre-registered = what the queue jobs P60/P61 evaluate; CoT arms are scored by generating the SC-CoT, on Spark"
        type: choice
        options:
          - "pre-registered sets (PrimeVul, VulSpot x2, CASTLE, J3 held-out matched + all; CoT arms add localisation)"
          - "PrimeVul length-matched (1,074)"
          - "PrimeVul length-matched sample (300)"
          - "VulSpot holdout, length-matched"
          - "VulSpot no-linux, length-matched"
          - "CASTLE (198 runnable programs)"
          - "amendment 3 round sets (J3 matched, SQLi held-out, J4 matched, CASTLE, PrimeVul 300)"
          - "amendment 3 category round, J3 (J3 matched, CASTLE, PrimeVul 300)"
        default: "pre-registered sets (PrimeVul, VulSpot x2, CASTLE, J3 held-out matched + all; CoT arms add localisation)"
      scorer:
        description: "Selective = verdict probability for HF models and adapters (CoT arms switch to SC-CoT generation automatically)"
        type: choice
        options:
          - "selective (HF model or adapter)"
          - "zero-shot (Ollama model, test only)"
        default: "selective (HF model or adapter)"
      ack_oom:
        description: "Train a model flagged as too big for this machine anyway"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pipeline:
    name: "Box GPU · ${{ inputs.train && 'train + test' || 'test only' }} · ${{ inputs.model }}"
    runs-on: [self-hosted, cyberdef, gpu-box]
    env:
      MACHINE: gpu-box
      MODEL: ${{ inputs.model }}
      STEPS: ${{ inputs.train && 'train + test' || 'test only' }}
      TAG: ${{ inputs.tag }}
      TEST_SET: ${{ inputs.test_set }}
      SCORER: ${{ inputs.scorer }}
      ACK_OOM: ${{ inputs.ack_oom }}
      DATA: ${{ inputs.data }}
      TRAIN_FLAGS: ${{ inputs.train_flags }}
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    steps:
      - name: 1. Plan (model, adapter, test set; this machine's scripts match the commit)
        id: plan
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" plan
      - name: 2. Checks (every control on this machine passes and catches its broken mutant)
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" checks
      - name: 3. Dataset (the same training data on both machines; CoT items built once on Spark, sha256 shown)
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" dataset
      - name: 4. Train (waits for this machine's GPU lock)
        if: steps.plan.outputs.train == 'true'
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" train
      - name: 5. Test (waits for this machine's GPU lock)
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" test
      - name: 6. Grade (recompute AUROC from per_case, compare to the 0.60 bar; an integrity mismatch fails)
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" grade
      - name: 7. Stamp provenance
        if: ${{ !cancelled() }}
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" provenance
      - name: 8. Upload adapter, result, per_case and provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACHINE }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
      - name: 9. Status of every stage, from its evidence
        if: ${{ !cancelled() }}
        run: bash "$CYBERDEF_REPO/scripts/ci_step.sh" status
